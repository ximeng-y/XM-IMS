{% extends "base.html" %}
{% block title %}库存总览{% endblock %}
{% block nav %}inventory{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>库存总览</h1>
    <div class="sub">按 SPU 分组查看库存；点击行首三角展开附属 SKU</div>

</div>

<div class="panel">
  <div class="table-scroll">

      <thead><tr><th style="width:2.5rem"></th><th class="num">ID</th><th>名称</th><th class="num">SKU 数</th><th class="num">合计库存</th><th>更新时间</th></tr></thead>

    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/pages/inventory.js?v=2"></script>{% endblock %}
