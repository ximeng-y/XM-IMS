{% extends "base.html" %}
{% block title %}库存总览{% endblock %}
{% block nav %}inventory{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>库存总览</h1>
    <div class="sub">按 SPU 分组查看库存；点击行内三角展开附属 SKU</div>
  </div>
  <div class="head-actions">
    <button type="button" id="btnColumns" class="btn-outline btn-sm">列设置</button>
  </div>
</div>

<div class="panel">
  <div class="ops-bar">
    <button type="button" class="btn-outline btn-sm" data-op="new-item">新建单品</button>
    <button type="button" class="btn-outline btn-sm" data-op="new-spu">新建 SPU</button>
    <button type="button" class="btn-outline btn-sm" data-op="in">入库</button>
    <button type="button" class="btn-outline btn-sm" data-op="out">出库</button>
    <button type="button" class="btn-outline btn-sm" data-op="adjust">盘点调整</button>
    <div class="ops-search">
      <input id="fltQ" placeholder="搜索 SPU / SKU 名称" autocomplete="off">
      <button type="button" id="btnClearQ" class="btn-outline btn-sm" hidden>清空</button>
    </div>
  </div>
</div>

<div class="panel" id="inventoryPanel">
  <div id="columnsHiddenHint" class="columns-hidden-hint" hidden>
    表格中的信息列已全部隐藏。<button type="button" class="btn-outline btn-sm" data-open-columns>打开列设置</button>
  </div>
  <div class="table-scroll table-scroll-auto" id="inventoryScroll">
    <table class="columns-table">
      <thead id="spuHead"><tr><th class="col-expand"></th><th class="col-id num">ID</th><th class="col-name">名称</th><th class="col-sku-count num">SKU 数</th><th class="col-total num">合计库存</th><th class="col-updated">更新时间</th></tr></thead>
      <tbody id="spuRows"><tr><td colspan="6" class="t-empty">加载中…</td></tr></tbody>
    </table>
    <!-- 定位用的临时底部留白（issue #49）：高度由脚本按需设置，不进入表格结构 -->
    <div id="inventoryTail" aria-hidden="true" hidden></div>
  </div>
</div>
{% endblock %}
