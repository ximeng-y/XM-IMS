{% extends "base.html" %}
{% block title %}单品{% endblock %}
{% block nav %}items{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>单品（SKU）管理</h1>
    <div class="sub">新建单品走「新建单品」小窗；也可到「库存」页操作区完成</div>
  </div>
  <div><button type="button" id="btnNewItem" class="btn-sm">＋ 新建单品</button></div>
</div>

<div class="panel">
  <h2>单品列表</h2>
  <div class="form-grid" style="margin-bottom:1rem">
    <div>
      <label for="fltQ">名称搜索</label>
      <input id="fltQ" placeholder="输入后回车或点查询" autocomplete="off">
    </div>
    <div>
      <label for="fltSpu">按 SPU 筛选</label>
      <select id="fltSpu"><option value="">全部 SPU</option></select>
    </div>
    <div><button id="btnFilter" type="button" class="btn-outline btn-sm">查询</button></div>
  </div>
  <div class="table-scroll">
    <table>
      <thead id="itemHead"><tr><th class="num">ID</th><th>名称</th><th>SPU</th><th class="num">库存</th><th>操作</th></tr></thead>
      <tbody id="itemRows"><tr><td colspan="5" class="t-empty">加载中…</td></tr></tbody>
    </table>
  </div>
  <div class="pager" id="itemPager"></div>
  <div class="hint">双击某行可跳转到库存页并定位该单品</div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/components/item-form.js?v=7"></script>
<script src="/static/js/pages/items.js?v=13"></script>
{% endblock %}
