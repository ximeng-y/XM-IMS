{% extends "base.html" %}
{% block title %}单品{% endblock %}
{% block nav %}items{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>单品（SKU）管理</h1>
  </div>
  <div class="head-actions">
    <button type="button" id="btnColumns" class="btn-outline btn-sm">列设置</button>
    <button type="button" id="btnNewItem" class="btn-sm">＋ 新建单品</button>
  </div>
</div>

<div class="panel">
  <h2>单品列表</h2>
  <div class="form-grid" style="margin-bottom:1rem">
    <div>
      <label for="fltQ">名称搜索</label>
      <input id="fltQ" placeholder="输入后回车或点查询" autocomplete="off">
    </div>
    <div>
      <label for="fltSpu">按 SPU 筛选</label>
      <select id="fltSpu"><option value="">全部 SPU</option></select>
    </div>
    <div><button id="btnFilter" type="button" class="btn-outline btn-sm">查询</button></div>
  </div>
  <div id="columnsHiddenHint" class="columns-hidden-hint" hidden>
    表格中的信息列已全部隐藏。<button type="button" class="btn-outline btn-sm" data-open-columns>打开列设置</button>
  </div>
  <div class="table-scroll">
    <table class="columns-table">
      <thead id="itemHead"><tr><th class="col-id num">ID</th><th class="col-name">名称</th><th class="col-spu">SPU</th><th class="col-qty num">库存</th><th class="col-actions">操作</th></tr></thead>
      <tbody id="itemRows"><tr><td colspan="5" class="t-empty">加载中…</td></tr></tbody>
    </table>
  </div>
  <div class="pager" id="itemPager"></div>
  <div class="hint">双击某行可跳转到库存总览页并定位该单品</div>
</div>
{% endblock %}
