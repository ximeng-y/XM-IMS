{% extends "base.html" %}
{% block title %}字段{% endblock %}
{% block nav %}fields{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>自定义字段</h1>
  </div>
</div>

<div class="panel">
  <h2>新建字段</h2>
  <form novalidate id="fCreate">
    <div class="form-grid">
      <div>
        <label for="fldName">字段名称 <span class="fieldreq">*</span></label>
        <input id="fldName" maxlength="50" placeholder="如：成本 / 售价 / 供应商" autocomplete="off">
      </div>
      <div>
        <label for="fldType">类型</label>
        <select id="fldType">
          <option value="string">文本</option>
          <option value="bool">开关</option>
          <option value="int">整数</option>
          <option value="decimal" selected>小数</option>
          <option value="percent">百分比</option>
        </select>
      </div>
      <div>
        <label for="fldScale">小数位（仅小数类型）</label>
        <input id="fldScale" type="number" min="0" max="6" value="2">
      </div>
    </div>
    <div class="form-check" style="margin-top:.8rem"><input id="fldNeg" type="checkbox"><label for="fldNeg" style="margin:0">允许负数（仅数值类）</label></div>
    <div style="margin-top:.4rem"><button type="submit" class="btn-sm">创建</button></div>
  </form>
  <div id="createResult"></div>
</div>

<div class="panel">
  <h2>字段列表</h2>
  <div class="table-scroll">
    <table>
      <thead><tr>
        <th>标记</th><th class="num">ID</th><th>名称</th><th>类型</th>
        <th>允许负数</th><th class="num">小数位</th><th style="width:11.875rem">操作</th>
      </tr></thead>
      <tbody id="fieldRows"><tr><td colspan="7" class="t-empty">加载中…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/pages/fields.js?v=4"></script>{% endblock %}
