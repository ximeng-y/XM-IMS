{% extends "base.html" %}
{% block title %}属性{% endblock %}
{% block nav %}fields{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>自定义属性</h1>
  </div>
  <div><button type="button" id="btnNewField" class="btn-sm">＋ 新建属性</button></div>
</div>

<div class="panel">
  <h2>属性列表</h2>
  <div class="table-scroll">
    <table>
      <thead><tr>
        <th>标记</th><th class="num">ID</th><th>名称</th><th>类型</th><th>公式</th>
        <th>允许负数</th><th class="num">小数位</th><th>操作</th>
      </tr></thead>
      <tbody id="fieldRows"><tr><td colspan="8" class="t-empty">加载中…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}
