{% extends "base.html" %}
{% block title %}SPU{% endblock %}
{% block nav %}spus{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>SPU 管理</h1>
    <div class="sub">顶层商品分类</div>
  </div>
  <div><button type="button" id="btnNewSpu" class="btn-sm">＋ 新建 SPU</button></div>
</div>

<div class="panel">
  <h2>SPU 列表</h2>
  <div class="table-scroll">
    <table>
      <thead><tr><th class="num">ID</th><th>名称</th><th class="num">SKU 数</th><th>更新时间</th><th>操作</th></tr></thead>
      <tbody id="spuRows"><tr><td colspan="5" class="t-empty">加载中…</td></tr></tbody>
    </table>
  </div>
  <div class="hint">双击某行可跳转到库存总览页并展开该 SPU 的单品</div>
</div>
{% endblock %}
