{% extends "base.html" %}
{% block title %}SPU{% endblock %}
{% block nav %}spus{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>SPU 管理</h1>
    <div class="sub">顶层商品分类</div>
  </div>
</div>

<div class="panel">
  <h2>新建 SPU</h2>
  <form novalidate id="fCreate">
    <div class="form-grid">
      <div>
        <label for="spuName">SPU 名称 <span class="fieldreq">*</span></label>
        <input id="spuName" maxlength="200" placeholder="如：纯棉 T 恤" autocomplete="off">
        <div class="hint">同名不冲突：创建单品时按名称精确匹配即会复用已有 SPU</div>
      </div>
    </div>
    <div style="margin-top:1rem"><button type="submit" class="btn-sm">创建</button></div>
  </form>
  <div id="createResult"></div>
</div>

<div class="panel">
  <h2>SPU 列表</h2>
  <div class="table-scroll">
    <table>
      <thead><tr><th class="num">ID</th><th>名称</th><th class="num">SKU 数</th><th>更新时间</th><th style="width:5.625rem">操作</th></tr></thead>
      <tbody id="spuRows"><tr><td colspan="5" class="t-empty">加载中…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/pages/spus.js?v=1"></script>{% endblock %}
